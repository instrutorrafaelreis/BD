<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21'/><line x1='9' y1='3' x2='9' y2='18'/><line x1='15' y1='6' x2='15' y2='21'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trilha do Saber - Avaliações Gamificadas</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.body.innerHTML += '<div style="color:red; background: black; padding: 20px; z-index:9999; position:absolute; top:0; left:0; width:100%; font-family: monospace;">ERROR: ' + message + '<br/>' + source + ':' + lineno + ':' + colno + '<br/>' + (error ? error.stack : '') + '</div>';
      };
      window.onunhandledrejection = function(event) {
        document.body.innerHTML += '<div style="color:red; background: black; padding: 20px; z-index:9999; position:absolute; top:0; left:0; width:100%; font-family: monospace;">PROMISE REJECTION: ' + event.reason + '</div>';
      };
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
